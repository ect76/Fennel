# Builds Fennel's Docker image every time the code changes, and publishes it to
# ghcr.io/<your-github-name>/fennel:latest for Unraid to pull.
name: Build Fennel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one build at a time, so two quick changes don't fight over saving the image
concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BUILD_REF=${{ github.sha }}
          # Unraid runs on ordinary PCs, so one x86 image is all it needs (an ARM copy doubled the build time and storage)
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
      # keep only the newest few images so old builds don't pile up in storage
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: fennel
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
